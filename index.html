 try{const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(s),signal:aiController.signal});const data=await r.json();if(!r.ok)throw Error(data.error||'AI分析暂时不可用。');$('ai-report').textContent='AI复习建议（基于本次错题，不能据此断定能力）\n\n'+data.analysis;}
 catch(e){$('ai-report').textContent=e.name==='AbortError'?'AI分析超时，可以稍后重试；本地统计不受影响。':e.message;}
 finally{clearTimeout(timer);aiController=null;$('btn-ai').disabled=false;}};
$('btn-clear').onclick=()=>{if(confirm('确定清空此版本的学习记录和进度？题库不会删除。')){aiController?.abort();state={version:3,active:{tab:'time',group:'pre',mode:'normal'},sessions:{},attempts:[],hard:[],wrong:[],legacy:null};currentTab='time';refreshSelect();load();openStats();}};
$('backup').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.href=url;a.download='不背历史学习进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);};
$('restore').onclick=()=>$('restore-file').click();$('restore-file').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>10000000)throw Error();const x=JSON.parse(await file.text());if(x.version!==3||!x.active||!x.sessions||!Array.isArray(x.attempts)||!Array.isArray(x.hard)||!Array.isArray(x.wrong))throw Error();const clean={version:3,active:{tab:x.active.tab==='topic'?'topic':'time',group:names[x.active.group]?x.active.group:'pre',mode:['normal','hard','wrong'].includes(x.active.mode)?x.active.mode:'normal'},sessions:{},attempts:x.attempts.filter(a=>byId[a.id]&&'ABCD'.includes(a.chosen)&&a.chosen.length===1&&typeof a.correct==='boolean').map(a=>({...a,correct:a.chosen===byId[a.id].ans})),hard:x.hard.filter(id=>byId[id]),wrong:x.wrong.filter(id=>byId[id]),legacy:null};for(const [k,v] of Object.entries(x.sessions)){if(!['hard','wrong',...timeGroups.map(([id])=>'time:'+id),...topicGroups.map(([id])=>'topic:'+id)].includes(k)||!Array.isArray(v.queue)||v.queue.length>5000||!v.queue.every(id=>byId[id])||!Number.isInteger(v.cursor)||v.cursor<0||v.cursor>v.queue.length)continue;const answers={};for(const [i,label] of Object.entries(v.answers||{})){if(/^\d+$/.test(i)&&+i<v.queue.length&&typeof label==='string'&&/^[ABCD]$/.test(label))answers[i]=label;}clean.sessions[k]={queue:v.queue,cursor:v.cursor,answers};const review=cleanReview(v.review,v.queue);if(review)clean.sessions[k].review=review;}if(!confirm('用备份替换当前学习记录？'))return;state=clean;persist();location.reload();}catch{alert('备份格式不正确，请选择本版本导出的进度文件。');}finally{e.target.value='';}};
$('popClose').onclick=()=>$('mingyanPopup').classList.remove('show');$('mingyanOverlay').onclick=()=>$('mingyanOverlay').classList.remove('show');
refreshSelect();if([...timeGroups,...topicGroups].some(([id])=>id===state.active.group))$('sel-group').value=state.active.group;load(state.active.mode||'normal');

let friendState={token:'',outbox:[]},friendBoard=null,friendTimer=null,friendSending=false;
try{const x=JSON.parse(localStorage.getItem('historyFriends_v1')||'null');if(x&&typeof x.token==='string'&&Array.isArray(x.outbox))friendState={token:x.token,outbox:x.outbox.slice(-300)};}catch{}
function saveFriends(){try{localStorage.setItem('historyFriends_v1',JSON.stringify(friendState));}catch{}}
const friendDay=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function friendMessage(text){$('friend-message').textContent=text;}
async function friendAPI(route,body){
 const r=await fetch('/api/friends/'+route,{method:body===undefined?'GET':'POST',headers:{...(body===undefined?{}:{'content-type':'application/json'}),...(friendState.token?{authorization:'Bearer '+friendState.token}:{})},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(10000)});
 const x=await r.json();if(!r.ok){const e=Error(x.error||'暂时无法连接小组。');e.status=r.status;e.expired=x.expired;throw e;}return x;
}
function renderFriends(){
 const b=friendBoard;$('friend-join').hidden=!!b;$('friend-live').hidden=!b;if(!b)return;
 $('friend-code').textContent=b.code;
 $('friend-summary').textContent='今天 '+b.checked+' / '+b.members.length+' 位好友已打卡 · 每天完成 '+b.goal+' 道不同题';
 $('friend-rows').innerHTML=b.members.map(m=>'<tr'+(m.id===b.me?' class="friend-me"':'')+'><td>'+(['🥇','🥈','🥉'][m.rank-1]||m.rank)+'</td><td>'+esc(m.nickname)+(m.id===b.me?'（我）':'')+'</td><td>'+m.week+'天</td><td>'+m.streak+'天</td><td>'+(m.checked?'🌟 已打卡':m.today+'/'+b.goal)+'</td></tr>').join('');
 const me=b.members.find(m=>m.id===b.me);$('friend-status').textContent=me?(me.checked?'🌟 今日已打卡 · 连续 '+me.streak+' 天':'今日打卡 '+me.today+'/'+b.goal+' · 和好友一起坚持'):'';
 $('friend-updated').textContent='已更新 · '+new Date(b.updatedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · 每5秒刷新';
}
async function refreshFriends(){if(!friendState.token)return;try{friendBoard=await friendAPI('board');renderFriends();friendMessage(friendState.outbox.length?'有答题记录等待同步，联网后会自动重试。':'');}catch(e){friendMessage(e.message);if(e.status===401){friendState={token:'',outbox:[]};friendBoard=null;saveFriends();renderFriends();}}}
async function flushFriends(){if(friendSending||!friendState.token||!friendState.outbox.length)return;friendSending=true;const token=friendState.token;
 try{while(friendState.outbox.length&&friendState.token===token){const item=friendState.outbox[0];try{const b=await friendAPI('answer',item);if(friendState.token!==token)break;friendBoard=b;friendState.outbox.shift();saveFriends();renderFriends();friendMessage('');}catch(e){if(e.expired){friendState.outbox.shift();saveFriends();continue;}friendMessage(e.message+' 已保留待同步记录。');break;}}}finally{friendSending=false;}}
function friendAnswer(q,label){if(!friendState.token)return;friendState.outbox.push({id:q.id,chosen:label,day:friendDay()});friendState.outbox=friendState.outbox.slice(-300);saveFriends();void flushFriends();}
$('btn-friends').onclick=async()=>{$('friend-dialog').showModal();friendMessage('GitHub Pages版本尚未连接好友后台，暂不支持实时榜与小组打卡。刷题、错题复习和本机保存正常使用。');$('friend-create').disabled=true;$('friend-enter').disabled=true;return;
 $('friend-dialog').showModal();friendMessage('');
 if(location.protocol==='file:'){friendMessage('好友打卡需要联网服务，请先启动“启动历史复习.cmd”，再从本机网址打开。');$('friend-create').disabled=true;$('friend-enter').disabled=true;return;}
 if(friendState.token){friendMessage('正在更新好友动态……');await flushFriends();await refreshFriends();}
 clearInterval(friendTimer);friendTimer=setInterval(()=>{if($('friend-dialog').open){void flushFriends();void refreshFriends();}},5000);
};
$('friend-close').onclick=()=>$('friend-dialog').close();$('friend-dialog').addEventListener('close',()=>clearInterval(friendTimer));
async function joinFriends(create){
 const nickname=$('friend-nickname').value.trim(),code=create?'':$('friend-room-input').value.trim().toUpperCase();
 if(!nickname){friendMessage('先起一个昵称吧。');$('friend-nickname').focus();return;}if(!create&&!code){friendMessage('请输入好友给你的6位小组码。');return;}
 $('friend-create').disabled=true;$('friend-enter').disabled=true;friendMessage('正在加入……');
 try{const b=await friendAPI('join',{nickname,code});friendState={token:b.token,outbox:[]};saveFriends();friendBoard=b;renderFriends();friendMessage(create?'小组建好了，把小组码发给好友吧！':'加入成功！从现在开始，每天完成10道不同题就能打卡。');}
 catch(e){friendMessage(e.message);}finally{$('friend-create').disabled=false;$('friend-enter').disabled=false;}
}
$('friend-create').onclick=()=>joinFriends(true);$('friend-enter').onclick=()=>joinFriends(false);
$('friend-copy').onclick=async()=>{try{await navigator.clipboard.writeText(friendBoard.code);friendMessage('小组码已复制，发给好友即可。');}catch{friendMessage('小组码：'+friendBoard.code+'，长按或选中即可复制。');}};
$('friend-leave').onclick=async()=>{if(!confirm('退出后将删除你在这个小组的打卡记录。确定退出？'))return;try{await friendAPI('leave',{});friendState={token:'',outbox:[]};friendBoard=null;saveFriends();renderFriends();$('friend-status').textContent='';friendMessage('已退出小组，本机刷题记录保留。');}catch(e){friendMessage(e.message);}};
window.addEventListener('online',()=>void flushFriends());
if(false){void flushFriends();void refreshFriends();}
</script></body></html>
